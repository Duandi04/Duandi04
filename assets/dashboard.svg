<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="100%">
  <!-- Definitions for gradients, patterns, and filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f355da" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00f2fe" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="850" height="280" rx="10" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1" />
  
  <!-- Tech Grid Overlay -->
  <rect width="850" height="280" rx="10" fill="url(#grid)" />

  <!-- Layout Dividers -->
  <line x1="425" y1="20" x2="425" y2="260" stroke="#1e293b" stroke-width="1" stroke-dasharray="5 5" />

  <!-- LEFT PANEL: SKILLS MATRIX -->
  <g transform="translate(30, 20)">
    <text x="0" y="25" fill="url(#accentCyan)" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" letter-spacing="1">/ DEV_COGNITIVE_MATRIX</text>
    
    <!-- Skill 1: ERP Architecture & Automation -->
    <g transform="translate(0, 50)">
      <text x="0" y="15" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">ERP Architecture &amp; Automations</text>
      <text x="320" y="15" fill="url(#accentCyan)" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" text-anchor="end">95%</text>
      <rect x="0" y="25" width="320" height="8" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <rect x="0" y="25" width="304" height="8" rx="4" fill="url(#accentCyan)" filter="url(#glowCyan)" />
    </g>

    <!-- Skill 2: Backend modular engineering -->
    <g transform="translate(0, 100)">
      <text x="0" y="15" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">Backend Modular Systems</text>
      <text x="320" y="15" fill="url(#accentPurple)" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" text-anchor="end">88%</text>
      <rect x="0" y="25" width="320" height="8" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <rect x="0" y="25" width="281" height="8" rx="4" fill="url(#accentPurple)" filter="url(#glowPurple)" />
    </g>

    <!-- Skill 3: AI-Driven Development -->
    <g transform="translate(0, 150)">
      <text x="0" y="15" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">AI Pair Programming &amp; LLM Orchestration</text>
      <text x="320" y="15" fill="url(#accentGreen)" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" text-anchor="end">100%</text>
      <rect x="0" y="25" width="320" height="8" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <rect x="0" y="25" width="320" height="8" rx="4" fill="url(#accentGreen)" />
    </g>

    <!-- Skill 4: Modular Frontend UI -->
    <g transform="translate(0, 200)">
      <text x="0" y="15" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">Interactive &amp; Modular UI (Vite/Next)</text>
      <text x="320" y="15" fill="url(#accentOrange)" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" text-anchor="end">75%</text>
      <rect x="0" y="25" width="320" height="8" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <rect x="0" y="25" width="240" height="8" rx="4" fill="url(#accentOrange)" />
    </g>
  </g>

  <!-- RIGHT PANEL: SYSTEM SPECIFICS -->
  <g transform="translate(455, 20)">
    <text x="0" y="25" fill="url(#accentPurple)" font-family="'Fira Code', monospace" font-size="13" font-weight="bold" letter-spacing="1">/ SYSTEM_METRICS_LOGS</text>

    <!-- Diagnostic Grid Info -->
    <g transform="translate(0, 50)">
      <!-- Panel Box -->
      <rect width="365" height="175" rx="6" fill="#0f172a" fill-opacity="0.5" stroke="#1e293b" stroke-width="1" />
      
      <!-- Tech details -->
      <g transform="translate(20, 25)">
        <text x="0" y="0" fill="#475569" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">CURRENT_PROJECT :</text>
        <text x="140" y="0" fill="#ffffff" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">Duandi04 Portfolio (Live)</text>

        <text x="0" y="25" fill="#475569" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">LATEST_DEPLOY   :</text>
        <text x="140" y="25" fill="#00f2fe" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" filter="url(#glowCyan)">MAIN_BRANCH_v1.2</text>

        <text x="0" y="50" fill="#475569" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">HOSTING_ZONE    :</text>
        <text x="140" y="50" fill="#ffffff" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">GitHub Pages // Local</text>

        <text x="0" y="75" fill="#475569" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">ACTIVE_SHELL    :</text>
        <text x="140" y="75" fill="#f355da" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" filter="url(#glowPurple)">PowerShell Core</text>

        <text x="0" y="100" fill="#475569" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">COMPLIANCE_RATE :</text>
        <text x="140" y="100" fill="#10b981" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">100% DRY (Don't Repeat Yourself)</text>
      </g>
      
      <!-- Tech grid graphic -->
      <line x1="20" y1="150" x2="345" y2="150" stroke="#1e293b" stroke-width="1" />
      <circle cx="340" cy="150" r="3" fill="#00f2fe" filter="url(#glowCyan)" />
      <circle cx="20" cy="150" r="3" fill="#f355da" filter="url(#glowPurple)" />
      <text x="182" y="162" fill="#334155" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle" font-weight="bold">COGNITIVE ARCHITECTURE V3.5</text>
    </g>
  </g>
</svg>
