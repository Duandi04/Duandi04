<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="100%" height="100%">
  <!-- Definitions for gradients, patterns, and filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#020305" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f355da" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f2fe" stroke-opacity="0.04" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="850" height="350" rx="12" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Tech Grid Overlay -->
  <rect width="850" height="350" rx="12" fill="url(#grid)" />

  <!-- Abstract tech lines / shapes -->
  <!-- Top decorative line -->
  <line x1="40" y1="35" x2="810" y2="35" stroke="#1f2937" stroke-width="1" />
  <line x1="40" y1="35" x2="200" y2="35" stroke="url(#accentCyan)" stroke-width="2" filter="url(#glowCyan)" />
  <line x1="650" y1="35" x2="810" y2="35" stroke="url(#accentPurple)" stroke-width="2" filter="url(#glowPurple)" />

  <!-- Terminal Window Bar -->
  <g id="terminal-header">
    <circle cx="55" cy="20" r="5" fill="#ef4444" />
    <circle cx="70" cy="20" r="5" fill="#f59e0b" />
    <circle cx="85" cy="20" r="5" fill="#10b981" />
    <text x="105" y="24" fill="#64748b" font-family="'Fira Code', 'Courier New', monospace" font-size="11" letter-spacing="1">bash - duandi04@core-mainframe</text>
  </g>

  <!-- Cybernetic Grid & Status Box (Left Panel) -->
  <g transform="translate(40, 60)">
    <!-- Subtitle / Status -->
    <text x="0" y="30" fill="url(#accentCyan)" font-family="'Fira Code', 'Courier New', monospace" font-size="13" font-weight="bold" letter-spacing="2">SYSTEM STATUS: ACTIVE</text>
    
    <!-- Large Name Title -->
    <text x="0" y="75" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="38" font-weight="900" letter-spacing="3">DUANDI 👋</text>
    <text x="185" y="75" fill="url(#accentPurple)" font-family="'Outfit', 'Inter', sans-serif" font-size="38" font-weight="900" letter-spacing="3" filter="url(#glowPurple)">_</text>

    <!-- Professional Titles -->
    <text x="0" y="110" fill="#94a3b8" font-family="'Fira Code', 'Courier New', monospace" font-size="15" letter-spacing="1">
      <tspan fill="#38bdf8">&gt; </tspan>Software Engineering Student
    </text>
    <text x="0" y="132" fill="#94a3b8" font-family="'Fira Code', 'Courier New', monospace" font-size="15" letter-spacing="1">
      <tspan fill="#38bdf8">&gt; </tspan>ERP Programmer &amp; Automation Architect
    </text>

    <!-- High-Tech Info Grid -->
    <g transform="translate(0, 165)">
      <!-- Box outline -->
      <rect width="400" height="90" rx="6" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <path d="M 0 0 L 15 0 L 0 15 Z" fill="url(#accentCyan)" />
      <path d="M 400 90 L 385 90 L 400 75 Z" fill="url(#accentPurple)" />
      
      <!-- Metrics Inside -->
      <text x="20" y="30" fill="#475569" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="bold">AI_COLLABORATION:</text>
      <text x="150" y="30" fill="#10b981" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="bold" filter="url(#glowCyan)">ENABLED (100%)</text>

      <text x="20" y="50" fill="#475569" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="bold">MANUAL_BOILERPLATE:</text>
      <text x="170" y="50" fill="#f43f5e" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="bold">HARAM (0%)</text>

      <text x="20" y="70" fill="#475569" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="bold">MATCHA_COGNITION:</text>
      <text x="160" y="70" fill="#38bdf8" font-family="'Fira Code', 'Courier New', monospace" font-size="11" font-weight="bold">OPTIMAL_STATE</text>
    </g>
  </g>

  <!-- High-Tech Data Visualization (Right Panel) -->
  <g transform="translate(480, 75)">
    <!-- Circuit grid lines -->
    <path d="M 40 40 L 140 40 L 170 70 L 290 70" fill="none" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 40 40 L 140 40 L 170 70 L 290 70" fill="none" stroke="url(#accentCyan)" stroke-width="1.5" stroke-dasharray="10 100" stroke-dashoffset="0" />
    
    <path d="M 60 180 L 120 180 L 150 150 L 300 150" fill="none" stroke="#1e293b" stroke-width="1.5" />
    
    <circle cx="170" cy="70" r="3" fill="#00f2fe" filter="url(#glowCyan)" />
    <circle cx="150" cy="150" r="3" fill="#f355da" filter="url(#glowPurple)" />

    <!-- Waveform or High-tech visual -->
    <rect x="80" y="60" width="220" height="70" rx="8" fill="#0f172a" fill-opacity="0.5" stroke="#1e293b" stroke-width="1" />
    <text x="95" y="80" fill="#475569" font-family="'Fira Code', 'Courier New', monospace" font-size="9" font-weight="bold">COGNITIVE ENGINES ACTIVE</text>
    
    <!-- Simulated Wave / Code visual using SVG path -->
    <path d="M 95 105 Q 110 85 125 105 T 155 105 T 185 105 T 215 105 T 245 105 T 275 105" fill="none" stroke="url(#accentCyan)" stroke-width="2" stroke-linecap="round" filter="url(#glowCyan)" opacity="0.8">
      <animate attributeName="stroke-dasharray" values="0,300;300,0;0,300" dur="5s" repeatCount="indefinite" />
    </path>
    <path d="M 95 110 Q 110 95 125 110 T 155 110 T 185 110 T 215 110 T 245 110 T 275 110" fill="none" stroke="url(#accentPurple)" stroke-width="1" stroke-linecap="round" opacity="0.4" />

    <!-- Sleek Tech Ring / Hexagon indicator -->
    <g transform="translate(10, 80)">
      <polygon points="25,5 45,17 45,40 25,52 5,40 5,17" fill="none" stroke="url(#accentCyan)" stroke-width="1.5" filter="url(#glowCyan)" />
      <polygon points="25,10 40,20 40,37 25,47 10,37 10,20" fill="none" stroke="#1e293b" stroke-width="1" />
      <circle cx="25" cy="28" r="4" fill="url(#accentPurple)" filter="url(#glowPurple)" />
    </g>

    <text x="80" y="175" fill="#475569" font-family="'Fira Code', 'Courier New', monospace" font-size="10" font-weight="bold">LOC: INDONESIA [WIB]</text>
    <text x="80" y="192" fill="#475569" font-family="'Fira Code', 'Courier New', monospace" font-size="10" font-weight="bold">CORE: NEXT.JS // VITE // LARAVEL</text>
  </g>

  <!-- Bottom decorative status line -->
  <rect x="40" y="315" width="770" height="8" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <rect x="40" y="315" width="550" height="8" rx="4" fill="url(#accentCyan)" filter="url(#glowCyan)">
    <animate attributeName="width" values="100;550;350;550" dur="10s" repeatCount="indefinite" />
  </rect>
  <text x="605" y="305" fill="#475569" font-family="'Fira Code', 'Courier New', monospace" font-size="9" text-anchor="end" font-weight="bold">COMPILING SYSTEM OVERLAYS...</text>
  <text x="810" y="305" fill="url(#accentPurple)" font-family="'Fira Code', 'Courier New', monospace" font-size="9" text-anchor="end" font-weight="bold" filter="url(#glowPurple)">100% SECURE</text>
</svg>
